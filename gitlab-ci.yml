stages:
  - lint
  - test
  - build

lint_php:
  stage: lint
  image: composer:latest
  script:
    - composer install --no-interaction --no-progress --prefer-dist
    - ./vendor/bin/php-cs-fixer fix --dry-run --diff

lint_js:
  stage: lint
  image: node:16
  script:
    - npm install
    - npm run lint

test_php:
  stage: test
  image: php:8.1
  services:
    - mysql:latest
  variables:
    DB_HOST: mysql-db
    DB_DATABASE: match
    DB_USERNAME: laravel_user
    DB_PASSWORD: laravel_password
  before_script:
    - apt-get update && apt-get install -y unzip
    - curl -sS https://getcomposer.org/installer | php
    - php composer.phar install
    - cp .env.testing .env
    - php artisan key:generate
    - php artisan migrate --env=testing
  script:
    - php artisan test

test_js:
  stage: test
  image: node:16
  script:
    - npm install
    - npm run test:unit

build_vue:
  stage: build
  image: node:16
  script:
    - cd src
    - npm install
    - npm run build
