stages:
  - up_app
  - zap_scan

# アプリをdocker-composeで立ち上げるジョブ
up_app:
  stage: up_app
  image: docker/compose:1.29.2
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker-compose -f docker-compose.yml up -d
    - echo "Waiting for app to start..."
    - |
      for i in {1..30}; do
        if curl -s http://localhost:80 > /dev/null; then
          echo "App is up!"
          break
        fi
        echo "Waiting..."
        sleep 2
      done

# ZAPスキャンを行うジョブ
zap_scan:
  stage: zap_scan
  image: zaproxy/zap-stable
  dependencies:
    - up_app
  script:
    - zap-baseline.py -t http://host.docker.internal:80 -g zap-gen.conf -r zap-report.html || true
  artifacts:
    paths:
      - zap-report.html
    expire_in: 1 week
