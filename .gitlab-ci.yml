stages:
  - zap_scan

zap_scan:
  stage: zap_scan
  image: owasp/zap2docker-stable
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    # ここでdocker-composeでアプリを立ち上げる（必要なら）
    - docker-compose -f docker-compose.yml up -d
    # アプリが立ち上がるのを待機（最大60秒）
    - echo "Waiting for app to start..."
    - |
      for i in {1..30}; do
        if curl -s http://localhost:80 > /dev/null; then
          echo "App is up!"
          break
        fi
        echo "Waiting..."
        sleep 2
      done
    # ZAPスキャンを実行
    - zap-baseline.py -t http://localhost:80 -g zap-gen.conf -r zap-report.html || true
  artifacts:
    paths:
      - zap-report.html
    expire_in: 1 week
