stages:
  - test

variables:
  COMPOSE_PROJECT_NAME: zapci
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""  # docker:dind でTLS無効化

services:
  - docker:dind

zap_scan:
  stage: test
  image: docker/compose:1.29.2
  script:
    # 1. Laravel環境をComposeで起動
    - docker-compose up -d
    # 2. 起動待機（環境により調整。必要ならヘルスチェック実装推奨）
    - echo "Waiting for containers to be ready..."
    - sleep 30
    # 3. ZAPをアプリに向けて実行
    - docker run --network ${COMPOSE_PROJECT_NAME}_default \
        -v $PWD:/zap/wrk:rw \
        zaproxy/zap-stable zap-baseline.py \
        -t http://nginx -r zap-report.html || true
  artifacts:
    paths:
      - zap-report.html
    expire_in: 1 week
