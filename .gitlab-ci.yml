stages:
  - test

variables:
  COMPOSE_PROJECT_NAME: zapci
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_TLS_CERTDIR: ""

services:
  - docker:dind

zap_scan:
  stage: test
  image: docker/compose:1.29.2
  script:
    - docker-compose up -d
    - echo "Waiting for containers to be ready..."
    - sleep 30
    - |
      docker run --network ${COMPOSE_PROJECT_NAME}_default \
        -v $PWD:/zap/wrk:rw \
        zaproxy/zap-stable zap-baseline.py \
        -t http://nginx \
        -r zap-report.html || true
  artifacts:
    paths:
      - zap-report.html
    expire_in: 1 week
