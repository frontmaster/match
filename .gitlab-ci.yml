stages:
  - up_app
  - zap_scan

up_app:
  stage: up_app
  image: docker/compose:1.29.2
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
  script:
    - docker-compose -f docker-compose.yml up -d
    - echo "Waiting for app to start..."
    - |
      for i in {1..30}; do
        if wget --spider --timeout=2 http://localhost:80; then
          echo "App is up!"
          break
        fi
        echo "Waiting..."
        sleep 2
      done

zap_scan:
  stage: zap_scan
  image: zaproxy/zap-stable
  services:
    - name: nginx-web
      alias: nginx-web
  before_script:
    - mkdir -p /zap/wrk
    - chmod 777 /zap/wrk
  script:
    - zap-baseline.py -t http://nginx-web -r zap-report.html || true
  artifacts:
    paths:
      - zap-report.html
    expire_in: 1 week


